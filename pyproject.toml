[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai"
version = "0.1.0"
description = "Local-first, CLI knowledge assistant with GraphRAG-style indexing"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nexus AI Contributors" }]
dependencies = [
  "markitdown[pdf,docx]>=0.1.0",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pydantic>=2.8.2",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "GitPython>=3.1.43",
  "litellm>=1.44.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
  "icalendar>=5.0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "ruff>=0.6.2",
]
ui = [
  "flask>=3,<4",
]
web = [
  "duckduckgo-search>=6.2.13",
]

[project.scripts]
nexus = "nexus_ai.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.package-data]
"nexus_ai.ui" = ["templates/*.html", "static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
